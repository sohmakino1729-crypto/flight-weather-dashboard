<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KFFZ Weather Evaluation Dashboard</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #4da6ff;
            --border-color: #333;
            --btn-bg: #2d2d2d;
            --btn-hover: #3d3d3d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 20px 0;
            overflow-y: auto;
        }

        .sidebar h1 {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            color: var(--accent-color);
            padding: 0 10px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-color);
            padding: 15px 20px;
            text-align: left;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            border-left: 4px solid transparent;
        }

        .nav-btn:hover {
            background-color: var(--btn-hover);
        }

        .nav-btn.active {
            background-color: rgba(77, 166, 255, 0.1);
            border-left-color: var(--accent-color);
            color: var(--accent-color);
            font-weight: bold;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .section {
            display: none;
            animation: fadeIn 0.3s;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h2 {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            background-color: #00c853;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s;
        }

        .copy-btn:hover {
            background-color: #00e676;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
            align-items: stretch;
        }

        @media (max-width: 1024px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }

        textarea, input[type="text"], input[type="date"], input[type="time"], .rich-textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 4px;
            font-family: inherit;
            box-sizing: border-box;
            resize: vertical;
        }
        
        textarea {
            min-height: 60px;
        }

        .rich-textarea {
            min-height: 80px;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        textarea:focus, input:focus, .rich-textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .iframe-container {
            width: 100%;
            height: 100%;
            min-height: 600px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-left: 10px;
            transition: opacity 0.2s;
        }
        
        .action-btn:hover {
            opacity: 0.8;
        }

        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        @keyframes fadein {
            from {bottom: 0; opacity: 0;} 
            to {bottom: 30px; opacity: 1;}
        }

        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;} 
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h1>Flight Wx Dashboard</h1>
        
        <div style="padding: 0 20px 20px 20px;">
            <div class="input-group" style="margin-bottom: 10px;">
                <label>Date</label>
                <input type="date" id="flight-date">
            </div>
            <div class="input-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Start</label>

                </div>
                <div style="flex: 1;">
                    <label>End</label>

            <div style="font-size: 0.75rem; color: #888; text-align: center; margin-top: 5px;">

        <button class="nav-btn active" onclick="showSection('sec1', this)">1. & 2. Pre-flight (Day Before)</button>
        <button class="nav-btn" onclick="showSection('sec3', this)">3. Pre-flight (Just Before)</button>
        <button class="nav-btn" onclick="showSection('sec4', this)">4. Post-flight</button>

    <!-- Main Content -->

            <h2>

                    <div class="input-group"><label><a href="https://aviationweather.gov/data/metar/?ids=KSDL&taf=1" target="_blank" style="color: var(--accent-color);">KSDL</a></label><textarea id="val-metar-sdl" rows="2"></textarea></div>

                    <div class="input-group"><label><a href="https://aviationweather.gov/gfa/?tab=obs&prodType=ceil&basemap=esriDark&center=33.38,-111.297&zoom=9&layers=rad,metar,airep,prog&radproduct=cref" target="_blank" style="color: var(--accent-color);">PIREPs (パイロットからの報告)</a></label><textarea id="val-pireps"></textarea></div>

        <!-- Section 4: Prediction vs Reality -->

    <div id="toast">Copied for Google Docs!</div>

    <script>
        let rawTAFData = { KPHX: "", KIWA: "", KSDL: "" };

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('flight-date').valueAsDate = new Date();
            
            document.getElementById('flight-date').addEventListener('change', highlightTAF);
            document.getElementById('flight-start').addEventListener('change', highlightTAF);
            document.getElementById('flight-end').addEventListener('change', highlightTAF);

            // Fetch on load
            fetchMETAR();
            fetchTAF();
            fetchAFD();
        });

        function showSection(secId, btnElement) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(secId).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
        }

        function getVal(id) {
            const el = document.getElementById(id);
            if (!el) return "";
            if (el.tagName === 'TEXTAREA' || el.tagName === 'INPUT') {
                return el.value ? el.value.trim() : "";
            } else {
                return el.innerText ? el.innerText.trim() : "";
            }
        }

        function formatList(text) {
            if (!text) return "";
            return text.split('\\n').map(line => `<li>${line}</li>`).join('');
        }

        function getFlightUTCWindow() {
            const dateStr = document.getElementById('flight-date').value;
            const startStr = document.getElementById('flight-start').value;
            const endStr = document.getElementById('flight-end').value;
            
            if(!dateStr || !startStr || !endStr) return null;
            
            const startLocal = new Date(`${dateStr}T${startStr}:00`);
            const endLocal = new Date(`${dateStr}T${endStr}:00`);
            
            if (isNaN(startLocal.getTime()) || isNaN(endLocal.getTime())) return null;
            
            if (endLocal <= startLocal) {
                endLocal.setDate(endLocal.getDate() + 1);
            }
            
            const startUTC = new Date(startLocal.getTime() + (7 * 60 * 60 * 1000));
            const endUTC = new Date(endLocal.getTime() + (7 * 60 * 60 * 1000));
            
            return { start: startUTC, end: endUTC };
        }

        function colorizeTAF(tafText) {
            if (!tafText) return "";
            const w = getFlightUTCWindow();
            if (!w) return tafText.replace(/\\n/g, '<br>');

            let text = tafText.replace(/\\s+(FM\\d{6}|BECMG|TEMPO|PROB\\d{2})\\b/g, '\\n$1');
            let lines = text.split('\\n').map(l => l.trim()).filter(l => l.length > 0);
            
            let blocks = [];
            let baseDate = w.start ? new Date(w.start.getTime()) : new Date(); 
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let startTime = null;
                let endTime = null;
                let isOverlay = false;
                
                if (line.startsWith('FM')) {
                    let m = line.match(/FM(\\d{2})(\\d{2})/);
                    if (m) {
                        let d = new Date(baseDate); d.setUTCDate(parseInt(m[1])); d.setUTCHours(parseInt(m[2]), 0, 0, 0);
                        startTime = d.getTime();
                    }
                } else if (line.match(/^(TEMPO|BECMG|PROB)/)) {
                    isOverlay = true;
                    let m = line.match(/(\\d{2})(\\d{2})\\/(\\d{2})(\\d{2})/);
                    if (m) {
                        let d1 = new Date(baseDate); d1.setUTCDate(parseInt(m[1])); d1.setUTCHours(parseInt(m[2]), 0, 0, 0);
                        let d2 = new Date(baseDate); d2.setUTCDate(parseInt(m[3])); d2.setUTCHours(parseInt(m[4]), 0, 0, 0);
                        if(d2 < d1) d2.setUTCMonth(d2.getUTCMonth() + 1);
                        startTime = d1.getTime();
                        endTime = d2.getTime();
                    }
                } else {
                    let m = line.match(/(\\d{2})(\\d{2})\\/(\\d{2})(\\d{2})/);
                    if (m) {
                        let d1 = new Date(baseDate); d1.setUTCDate(parseInt(m[1])); d1.setUTCHours(parseInt(m[2]), 0, 0, 0);
                        let d2 = new Date(baseDate); d2.setUTCDate(parseInt(m[3])); d2.setUTCHours(parseInt(m[4]), 0, 0, 0);
                        if(d2 < d1) d2.setUTCMonth(d2.getUTCMonth() + 1);
                        startTime = d1.getTime();
                        endTime = d2.getTime();
                    }
                }
                blocks.push({ line, startTime, endTime, isOverlay, isMatch: false });
            }
            
            for (let i = 0; i < blocks.length; i++) {
                if (!blocks[i].isOverlay && blocks[i].startTime && !blocks[i].endTime) {
                    let nextFMTime = null;
                    for (let j = i + 1; j < blocks.length; j++) {
                        if (!blocks[j].isOverlay && blocks[j].startTime) {
                            nextFMTime = blocks[j].startTime;
                            break;
                        }
                    }
                    if (nextFMTime) {
                        blocks[i].endTime = nextFMTime;
                    } else {
                        blocks[i].endTime = blocks[0].endTime || (blocks[i].startTime + 24*3600*1000);
                    }
                }
            }
            
            let fs = w.start.getTime();
            let fe = w.end.getTime();
            
            for (let i = 0; i < blocks.length; i++) {
                let b = blocks[i];
                if (b.startTime && b.endTime) {
                    if (fs < b.endTime && fe > b.startTime) {
                        b.isMatch = true;
                    }
                } else if (i === 0) {
                    if (b.endTime && fs < b.endTime && fe > b.startTime) {
                        b.isMatch = true;
                    }
                }
            }
            
            let resultHTML = [];
            for (let i = 0; i < blocks.length; i++) {
                if (blocks[i].isMatch) {
                    resultHTML.push(`<span style="color: #ff6b6b; font-weight: bold;">${blocks[i].line}</span>`);
                } else {
                    resultHTML.push(blocks[i].line);
                }
            }
            
            return resultHTML.join('<br>');
        }

        async function fetchMETAR() {
            const display = document.getElementById('metar-display');
            display.textContent = "Fetching METAR data...";
            try {
                const res = await fetch('https://aviationweather.gov/api/data/metar?ids=KFFZ,KPHX,KIWA,KSDL&format=raw');
                if (!res.ok) throw new Error("Fetch failed");
                const text = await res.text();
                display.textContent = "Data fetched successfully at " + new Date().toLocaleTimeString();
                
                const lines = text.split(/\\r?\\n/);
                lines.forEach(line => {
                    if (line.includes('KFFZ') || line.startsWith('KFFZ')) document.getElementById('val-metar-ffz').value = line.trim();
                    if (line.includes('KPHX') || line.startsWith('KPHX')) document.getElementById('val-metar-phx').value = line.trim();
                    if (line.includes('KIWA') || line.startsWith('KIWA')) document.getElementById('val-metar-iwa').value = line.trim();
                    if (line.includes('KSDL') || line.startsWith('KSDL')) document.getElementById('val-metar-sdl').value = line.trim();
                });
            } catch(e) {
                display.textContent = "Failed to fetch METAR.";
            }
        }

        async function fetchTAF() {
            const display = document.getElementById('taf-display');
            display.textContent = "Fetching TAF data...";
            try {
                const res = await fetch('https://aviationweather.gov/api/data/taf?ids=KPHX,KIWA,KSDL&format=raw');
                if (!res.ok) throw new Error("Fetch failed");
                const text = await res.text();
                display.textContent = "Data fetched successfully at " + new Date().toLocaleTimeString();
                
                const lines = text.split(/\\r?\\n/);
                let currentStation = null;
                let extracted = { KPHX: [], KIWA: [], KSDL: [] };
                
                lines.forEach(line => {
                    if (line.includes('KPHX') || line.startsWith('KPHX')) currentStation = 'KPHX';
                    else if (line.includes('KIWA') || line.startsWith('KIWA')) currentStation = 'KIWA';
                    else if (line.includes('KSDL') || line.startsWith('KSDL')) currentStation = 'KSDL';
                    
                    if (currentStation && line.trim() !== '') {
                        extracted[currentStation].push(line.trim());
                    }
                });

                rawTAFData.KPHX = extracted['KPHX'].join('\\n');
                rawTAFData.KIWA = extracted['KIWA'].join('\\n');
                rawTAFData.KSDL = extracted['KSDL'].join('\\n');
                highlightTAF();
            } catch(e) {
                display.textContent = "Failed to fetch TAF.";
            }
        }

        async function fetchAFD() {
            const afdInput = document.getElementById('val-afd');
            afdInput.value = "Fetching Area Forecast Discussion (PSR)...";
            try {
                const res = await fetch('https://api.weather.gov/products/types/AFD/locations/PSR');
                if (!res.ok) throw new Error("Fetch failed");
                const data = await res.json();
                const text = data['@graph'][0].productText;
                
                const match = text.match(/\\.AVIATION\\.\\.\\.([\\s\\S]*?)(?=\\.\\w+ \\w+\\.\\.\\.|\\.\\w+\\.\\.\\.|$)/);
                if (match) {
                    afdInput.value = "[自動抽出: NWS Phoenix - AVIATION]\\n" + match[1].trim();
                } else {
                    afdInput.value = "AVIATION section not found.\\n\\n" + text.substring(0, 500);
                }
            } catch(e) {
                afdInput.value = "Failed to auto-fetch AFD.";
            }
        }

        async function executeCopy(htmlContent) {
            function showToast() {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 3000);
            }

            try {
                const blobHtml = new Blob([htmlContent], { type: "text/html" });
                const blobText = new Blob(["Please paste this in Google Docs. (Rich Text is active in your clipboard)"], { type: "text/plain" });
                const clipboardItem = new ClipboardItem({
                    "text/html": blobHtml,
                    "text/plain": blobText
                });
                await navigator.clipboard.write([clipboardItem]);
                showToast();
            } catch (err) {
                try {
                    const div = document.createElement("div");
                    div.innerHTML = htmlContent;
                    div.style.position = "absolute";
                    div.style.left = "-9999px";
                    document.body.appendChild(div);
                    
                    const range = document.createRange();
                    range.selectNodeContents(div);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                    
                    document.execCommand("copy");
                    sel.removeAllRanges();
                    document.body.removeChild(div);
                    showToast();
                } catch (fallbackErr) {
                    console.error("Copy failed", fallbackErr);
                    alert("クリップボードへのコピーに失敗しました。");
                }
            }
        }
